# EA-Trav 컨테이너 구성
# - sim   : Isaac Lab 2.3.0 (URDF -> USD 변환, 지형·구조물, 롤아웃)
# - train : PyTorch 학습·데이터 처리 (Dockerfile.train)
# - utils : 기타 CPU 작업 - URDF 생성·검증, 데이터 수집 등 (Dockerfile.utils)
# 공통 규칙: 코드는 /workspace/eatrav, 대용량 산출물은 /data/ea-trav

name: eatrav

# 서비스 공통 설정 (sim은 볼륨을 자체 정의하므로 volumes만 덮어씀)
x-common: &common
  working_dir: /workspace/eatrav
  # PID 1을 init으로 둔다 - 기본 entrypoint(sleep infinity)는 자식을 회수하지 않아
  # Isaac Sim이 fork한 프로세스가 끝날 때마다 좀비가 쌓인다
  init: true
  ipc: host
  restart: unless-stopped
  volumes:
    - ../:/workspace/eatrav
    - /home/jairlab/data:/data

# 이 프로젝트가 쓰는 GPU만 노출한다 - Isaac Sim은 기동할 때 보이는 GPU를 전부 초기화해
# 장당 약 550MiB의 CUDA 컨텍스트를 만들므로, 전부 노출하면 쓰지 않는 GPU까지 점유한다.
# 컨테이너 안에서는 노출된 순서대로 cuda:0~4로 다시 매겨진다
# (cuda:0->0, cuda:1->1, cuda:2->2, cuda:3->4, cuda:4->5). utils는 GPU 미사용.
x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            device_ids: ["0", "1", "2", "4", "5"]
            capabilities: [gpu]

services:
  sim:
    <<: [*common, *gpu]
    image: nvcr.io/nvidia/isaac-lab:2.3.0
    container_name: airlab_hw_eatrav_sim
    entrypoint: ["/bin/bash", "-c", "sleep infinity"]
    volumes:
      - ../:/workspace/eatrav
      - /home/jairlab/data:/data
      - /home/jairlab/data/ea-trav/isaac-cache/kit:/isaac-sim/kit/cache
      - /home/jairlab/data/ea-trav/isaac-cache/ov:/root/.cache/ov
      - /home/jairlab/data/ea-trav/isaac-cache/glcache:/root/.cache/nvidia/GLCache
      - /home/jairlab/data/ea-trav/isaac-cache/computecache:/root/.nv/ComputeCache
    environment:
      - ACCEPT_EULA=Y
      - PRIVACY_CONSENT=Y

  train:
    <<: [*common, *gpu]
    build:
      context: .
      dockerfile: Dockerfile.train
    image: t0mark251/eatrav_train
    container_name: airlab_hw_eatrav_train
    command: ["sleep", "infinity"]
    shm_size: "32gb"

  utils:
    <<: *common
    build:
      context: .
      dockerfile: Dockerfile.utils
    image: t0mark251/eatrav_utils
    container_name: airlab_hw_eatrav_utils
    command: ["sleep", "infinity"]
