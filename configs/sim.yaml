# sim 단계 설정 (URDF -> USD 변환 + 검증 + 지형 생성 + 스폰 + 시뮬 실행·렌더 체크)
# 원칙: plan/urdf.md — 임계값·여유율 상수는 config로 관리

# URDF -> USD 변환 (scripts/sim/utils/robot_spawn.py)
converter:
  # plan 파서 규약과 정합: fixed 조인트 링크(센서·볼 캐스터)는 병합 시도
  # (Isaac Sim 5.1은 질량·충돌 있는 링크를 병합하지 않음 — 검사가 둘 다 허용)
  merge_fixed_joints: true
  # 생성 URDF는 프리미티브 충돌 형상뿐이라 convex_hull이면 손실 없음
  collider_type: convex_hull
  # 바퀴 원통을 캡슐로 바꾸면 접지선이 점이 되므로 원통 유지
  replace_cylinders_with_capsules: false
  # 관성 없는 링크의 기본 밀도 (생성 URDF는 전 링크 관성 명시 -> 미사용)
  link_density: 0.0

# 스폰 시 조인트 드라이브 게인 규칙 (scripts/sim/utils/robot_spawn.py)
# USD에는 게인을 굽지 않으며, 제어기 단계 전까지의 자세 유지용 기본값이다.
# 분류: effort<=0 = passive, continuous+effort>0 = velocity(바퀴), 나머지 = position
drive:
  # 위치 유지 PD: k = scale x effort 한계 (자세 오차 0.1rad에서 토크 포화 수준)
  pos_stiffness_scale: 10.0
  # d = k x ratio
  pos_damping_ratio: 0.1
  # 바퀴 속도 드라이브: d = scale x effort / 속도 한계 (속도 오차 1/scale에서
  # 토크 포화). 1.0은 접촉 부하가 큰 패턴(매커넘 대각·skid 선회)에서 바퀴가
  # 지면에 끌려 목표를 못 따라가는 것 실측 -> 3.0으로 상향
  vel_damping_scale: 3.0
  # 구동 관절 반영 관성 (kg m^2). 0 = 미사용 (이전 파일럿에서 0이 최선 실측)
  armature: 0.0

# 시뮬 실행 체크 (스폰 -> 기립 홀드 -> 상태 관찰. tools/01_sim.py)
sim_run:
  # 로코모션 RL 관례 물리 스텝 (200Hz)
  physics_dt: 0.005
  # GPU 물리 파이프라인 장치
  device: cuda:0
  # 스폰 후 물리 실행 시간 (s)
  run_time: 4.0
  # 기립 높이 위 여유 낙하 (m) — 초기 지면 관통 방지
  spawn_margin: 0.01
  # 평지 지면 반크기 (m)
  ground_size: 20.0
  # 셀프충돌 활성 — 1단계 정적 검사의 "임의 자세 셀프충돌은 시뮬 접촉으로 해소"
  # 전제와 정합 (USD에 굽지 않고 스폰 시점에 적용)
  self_collision: true

# 수동 접촉 링크의 공통 마찰 상수 (scripts/sim/utils/environment.py 스폰 시 바인딩)
# URDF에 없는 접촉 물리를 전 로봇 공통으로 상수화한다 (plan 제어기 섹션 원칙).
# 02(제어기)·03(롤아웃) 진입점이 spawn_robot contact_cfg로 전달한다.
contact:
  # 볼 캐스터(fixed 병합 구): 전방향 구름을 낮은 마찰 미끄럼으로 근사.
  # 0.04도 하중 비중이 큰 개체에서 차동 선회를 짓누르는 것 실측
  # (좌우 바퀴가 같은 속도로 강제) -> 이상적 롤링에 가깝게 0.01
  ball_friction: 0.01
  # 평지 스폰 씬 지면 마찰 — 3단계 지형 마찰(terrain 섹션 1.0)과 정합.
  # 미명시 시 PhysX 기본(0.5)이 되어 WVN 평지 기준선이 오염된다
  ground_friction: 1.0
  # 매커넘·옴니 수동 롤러: 접지 마찰을 표준값으로 명시
  roller_friction: 1.0
  # legged 발 (meta contact_links): 미명시 시 PhysX 기본 0.5로 미끄러워
  # 걸음이 스케이팅 쪽으로 기우는 것 실측 — 표준값 명시
  foot_friction: 1.0

# TerrainGenerator 지형 (scripts/sim/utils/environment.py add_terrain)
# Isaac Lab 보행 RL 표준 ROUGH_TERRAINS_CFG와 정합 (종류·비율·치수 동일).
# 격자 규모만 파일럿용으로 축소 (RL 원본: 10행 x 20열, 테두리 20m)
terrain:
  # 서브지형 1칸 크기 (x, y) (m)
  size: [8.0, 8.0]
  # 바깥 테두리 폭 (m)
  border_width: 2.0
  # 격자: 행(난이도 축) x 열(종류 축)
  num_rows: 4
  num_cols: 4
  # 난이도 커리큘럼 (행 방향 오름차순 — RL과 동일)
  curriculum: true
  # 커리큘럼 스폰 시작 난이도 상한 행 (지형 위 스폰은 3단계에서 사용)
  max_init_terrain_level: 5
  # 종류별 비율 (합 1.0 — RL 원본 비율)
  stairs_proportion: 0.2
  stairs_inv_proportion: 0.2
  boxes_proportion: 0.2
  rough_proportion: 0.2
  slope_proportion: 0.1
  slope_inv_proportion: 0.1
  # 계단 높이 범위 (m), 계단 폭 (m) — plan 타겟 케이스(계단 단차) 대응
  step_height: [0.05, 0.23]
  step_width: 0.3
  # 계단 칸 테두리 (m), 계단 중앙 플랫폼 폭 (m)
  stairs_border: 1.0
  stairs_platform_width: 3.0
  # 랜덤 박스 격자: 칸 폭 (m), 높이 범위 (m)
  grid_width: 0.45
  grid_height: [0.05, 0.20]
  # 랜덤 러프 노이즈 높이 범위 (m)
  rough_noise: [0.02, 0.10]
  # 높이맵(러프·경사) 칸 테두리 (m)
  hf_border: 0.25
  # 피라미드 경사 기울기 범위 (rad)
  slope_range: [0.0, 0.4]
  # 경사·박스 중앙 플랫폼 폭 (m)
  platform_width: 2.0
  # 지면 마찰 (multiply 결합 — RL과 동일)
  static_friction: 1.0
  dynamic_friction: 1.0

# 파일럿 렌더 (Camera 센서 오프스크린 캡처. scripts/sim/utils/render.py)
render:
  width: 960
  height: 720
  # 캡처 전 렌더 파이프라인 워밍업 프레임 수
  warmup_frames: 12
  # 카메라 XY 오프셋 = scale x 최대 외형 치수 (하한 min, 단위 m)
  # 실거리 = 오프셋 x 1.54 (eye = 몸 중심 + (d, d, 0.6d)). 배율은 렌더 확인으로 보정
  cam_dist_scale: 2.2
  cam_dist_min: 0.8
  # 지형 탑뷰 카메라 고도 = scale x 지형 최대 변 길이 (m)
  topview_height_scale: 1.6
  # form별 로봇 표시 색 (RGB 0-1, 시각 확인용 displayColor)
  form_colors:
    diff: [0.85, 0.30, 0.25]
    skid: [0.95, 0.60, 0.20]
    ackermann: [0.90, 0.80, 0.25]
    omni: [0.55, 0.35, 0.75]
    quad: [0.30, 0.65, 0.90]
    hex: [0.25, 0.75, 0.55]
    humanoid: [0.90, 0.45, 0.65]
    wheeled_humanoid: [0.45, 0.55, 0.85]
    default: [0.70, 0.70, 0.70]
