converter:
  merge_fixed_joints: true
  collider_type: convex_hull
  replace_cylinders_with_capsules: false
  link_density: 0.0
drive:
  pos_stiffness_scale: 10.0
  pos_damping_ratio: 0.1
  vel_damping_scale: 3.0
  armature: 0.0
sim_run:
  physics_dt: 0.005
  device: cuda:0
  run_time: 4.0
  spawn_margin: 0.01
  ground_size: 20.0
  self_collision: true
  success:
    height_ratio_min: 0.65
    tilt_max_deg: 25.0
    tilt_max_deg_by_form:
      humanoid: 15.0
      wheeled_humanoid: 20.0
contact:
  ball_friction: 0.01
  ground_friction: 1.0
  roller_friction: 1.0
  foot_friction: 1.0
terrain:
  size: [8.0, 8.0]
  border_width: 2.0
  num_rows: 4
  num_cols: 4
  curriculum: true
  max_init_terrain_level: 5
  stairs_proportion: 0.2
  stairs_inv_proportion: 0.2
  boxes_proportion: 0.2
  rough_proportion: 0.2
  slope_proportion: 0.1
  slope_inv_proportion: 0.1
  step_height: [0.05, 0.23]
  step_width: 0.3
  stairs_border: 1.0
  stairs_platform_width: 3.0
  grid_width: 0.45
  grid_height: [0.05, 0.20]
  rough_noise: [0.02, 0.10]
  hf_border: 0.25
  slope_range: [0.0, 0.4]
  platform_width: 2.0
  static_friction: 1.0
  dynamic_friction: 1.0
structures:
  enabled: true
  band_gap: 3.0
  cell_size: [6.0, 6.0]
  kinds: [narrow_wall, low_ceiling, desk]
  num_levels: 3
  ground_pad_thickness: 0.2
  color: [0.68, 0.64, 0.58]
  friction: 1.0
  narrow_wall:
    gap: [1.2, 0.35]
    thickness: 0.25
    height: 1.2
    length: 3.0
  low_ceiling:
    clearance: [1.2, 0.30]
    slab_thickness: 0.2
    span: 2.4
    length: 2.4
    support_thickness: 0.2
  desk:
    top_height: [0.90, 0.35]
    top_size: [1.6, 1.6]
    top_thickness: 0.06
    leg_size: 0.08
render:
  width: 960
  height: 720
  warmup_frames: 12
  cam_dist_scale: 2.2
  cam_dist_min: 0.8
  topview_height_scale: 1.6
  structures_cam_dist_scale: 0.85
  structures_cam_height_scale: 0.55
  form_colors:
    diff: [0.85, 0.30, 0.25]
    skid: [0.95, 0.60, 0.20]
    ackermann: [0.90, 0.80, 0.25]
    omni: [0.55, 0.35, 0.75]
    quad: [0.30, 0.65, 0.90]
    hex: [0.25, 0.75, 0.55]
    humanoid: [0.90, 0.45, 0.65]
    wheeled_humanoid: [0.45, 0.55, 0.85]
    default: [0.70, 0.70, 0.70]
