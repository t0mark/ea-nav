env:
  terrain: rough
  physics_dt: 0.005
  decimation: 4
  episode_len_s: 20.0
  resample_cmd_s: 10.0
  action_scale: 0.25
  action_clip: 3.0
  reset_joint_scale: [1.0, 1.0]
  reset_pos_xy_noise: 0.5
  yaw_noise: 3.14
  reset_vel_noise: 0.0
  push_interval_s: 100000.0
  push_max_vel: 0.5
  actuator_model: dcmotor
  contact_force_thresh: 1.0
  max_tilt_deg: 180.0
  term_height_ratio: 0.0
  termination_grace_steps: 0
  back_ratio: 1.0
  vy_ratio: 1.0
  zero_cmd_prob: 0.02
  spacing: 5.0
  self_collision: false
  solver_iters: [4, 0]
scan:
  size: [1.6, 1.0]
  resolution: 0.1
  offset_z: 20.0
  clip: 1.0
gains:
  kp_per_kg: 2.0
  kp_min: 20.0
  kp_max: 1400.0
  kd_ratio: 0.025
cmd:
  froude: 0.6
  v_min: 0.3
  v_cap: 2.0
  heading_command: true
  heading_kp: 0.5
  wz_max: 1.0
  curriculum_v_start: 1.0
  curriculum_v_step: 0.25
  curriculum_track_threshold: 0.7
  curriculum_score_min_cmd: 0.35
  min_cmd_norm: 0.2
  deploy_ratio: 0.7
obs_noise:
  enabled: true
  lin_vel: 0.1
  ang_vel: 0.2
  gravity: 0.05
  joint_pos: 0.01
  joint_vel: 1.5
obs:
  lin_vel: 1.0
  ang_vel: 1.0
  joint_pos: 1.0
  joint_vel: 1.0
  height_scan: 1.0
  include_morph: false
  include_scan: false
morph:
  len_scale: 1.0
  ang_scale: 3.1416
  vel_scale: 30.0
  mass_log_scale: 2.5
  effort_log_scale: 6.0
rewards:
  only_positive_rewards: true
  termination: 0.0
  penalty_ramp_iters: 0
  track_avg_vel: false
  track_lin_sigma: 0.25
  track_ang_sigma: 0.25
  track_lin: 1.5
  track_ang: 0.75
  lin_vel_z: -2.0
  ang_vel_xy: -0.05
  orientation: -2.5
  torque: -0.11
  dof_acc: -2.5e-7
  action_rate: -0.01
  dof_soft_ratio: 0.9
  dof_pos_limits: 0.0
  joint_deviation: 0.0
  feet_air_time: 0.25
  feet_air_thresh_scale: 2.1
  feet_air_thresh_min: 0.5
  feet_air_thresh_max: 0.5
  cmd_deadband: 0.1
  feet_air_time_biped: 0.25
  feet_air_threshold_biped: 0.4
  feet_slide: -0.25
  undesired_contact: 0.0
ppo:
  num_steps_per_env: 24
  hidden_dims: [128, 128, 128]
  activation: elu
  init_noise_std: 1.0
  num_learning_epochs: 5
  num_mini_batches: 4
  clip_param: 0.2
  gamma: 0.99
  lam: 0.95
  value_loss_coef: 1.0
  entropy_coef: 0.01
  std_anneal_to: null
  learning_rate: 1.0e-3
  max_grad_norm: 1.0
  schedule: adaptive
  desired_kl: 0.01
forms:
  humanoid:
    env:
      back_ratio: 0.0
      vy_ratio: 0.0
    rewards:
      termination: -4.0
      orientation: -1.0
      lin_vel_z: 0.0
      joint_deviation: -0.2
      dof_pos_limits: -1.0
    cmd:
      froude: 0.35
      v_cap: 1.0
      wz_max: 1.0
    gains:
      kp_per_kg: 4.0
      ankle_kp_per_kg: 0.5
      kd_ratio: 0.03
      ankle_kd_ratio: 0.2
train:
  seed: 42
  chunk_iters: 50
  pilot:
    num_robots: 1
    robot_names: [go2_proxy]
    terrain_mode: flat
    envs_per_robot: 1024
    iterations: 2000
    terrain:
      num_rows: 4
      num_cols: 4
  full:
    num_robots: 24
    envs_per_robot: 128
    iterations: 3000
    terrain:
      num_rows: 10
      num_cols: 20
