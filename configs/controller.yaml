ctrl:
  decimation: 4
  limit_margin: 0.9
  yaw_rate_cap: 3.0
  skid_yaw_scale: 2.2
  lin_accel: 1.5
  yaw_accel: 4.0
  pid_kp: 0.5
  pid_ki: 0.3
  pid_kd: 0.0
  pid_i_limit: 1.0
pp:
  lookahead_min: 0.5
  lookahead_time: 0.6
  lookahead_turn_ratio: 0.5
  goal_change_eps: 0.05
  decel_margin: 0.7
  stop_dist: 0.12
  lat_accel: 2.0
  pivot_bearing: 1.0
  creep_ratio: 0.15
  turn_w_ratio: 0.7
  reverse_ratio: 0.4
  reverse_enter_bearing: 1.8
  reverse_exit_bearing: 0.6
  yaw_kp: 2.0
mppi:
  # plan_dt: MPPI 롤아웃 한 스텝의 시간 — 제어 주기(ctrl.decimation x physics_dt, 보통
  # 0.01-0.03s)와 다르다. horizon x plan_dt가 lookahead 지점이 로봇에서 충분히
  # 멀어질 수 있는 실제 내다보는 시간(초)을 결정한다 (planner.py 클래스 docstring 참고).
  plan_dt: 0.15
  horizon: 12
  # replan_decimation: 제어 스텝 몇 번마다 재계획할지 — MPPI는 이 주기로만 돌고,
  # 그 사이는 pursuit(PP)가 고주기로 조준점을 추종해 채운다
  replan_decimation: 10
  # 재계획 간 조준점이 흔들리면(특히 yaw 방향) pursuit+PID 루프가 공진해 실제 로봇이
  # 흔들리는 게 slope 파일럿 실측(diff_0000)으로 확인됨 — num_samples를 늘리고 noise를
  # 줄이고 lambda_(softmax 온도)를 키워 매 재계획의 추정을 더 평균화·안정화한다
  num_samples: 384
  noise_ratio: 0.3
  lambda_: 0.5
  lookahead_steps: 5
  goal_weight: 1.0
  slope_weight: 8.0
  slope_cap: 0.6
  smooth_weight: 0.3
  scan:
    resolution: 0.25
    size: [6.0, 6.0]
    offset_z: 2.0
governor:
  margin: 0.85
scenario:
  waypoints: [[2.5, 0.0], [2.5, 2.5], [5.0, 2.5]]
  reach_radius: 0.35
  base_contact_thresh: 1.0
  fall_tilt_deg: 60.0
  timeout_margin: 2.0
  timeout_min: 40.0
  timeout_max: 150.0
  timeout_v_ratio: 0.7
  settle_time: 0.5
  traj_interval: 0.1
  scenes:
    wheeled: [flat, slope]
    legged: [flat, slope, stairs]
  eval_terrain:
    size: [14.0, 14.0]
    slope_angle: 0.2
    stair_height: 0.12
  video:
    capture_interval_s: 0.15
    warmup_frames: 2
    path_interval_s: 0.4
  marker_colors: [[0.15, 0.8, 0.25], [0.95, 0.8, 0.1], [0.9, 0.25, 0.2]]
