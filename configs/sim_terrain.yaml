# TerrainGenerator 지형 구성
# plan.md 타겟 케이스(계단 단차, 경사 각도)에 맞춰 계단·경사 지형만 정의한다.
# scripts/sim/env/terrain.py 의 load_terrain_generator_cfg() 가 이 파일을 읽어 TerrainGeneratorCfg로 변환한다.

seed: 42                   # 재현 가능한 시각 검증을 위한 난수 시드
curriculum: false          # false: 난이도를 셀마다 랜덤 배치, true: 행 순서대로 난이도 오름차순 정렬

size: [8.0, 8.0]            # 서브 지형 1개의 가로 x 세로 (m)
border_width: 2.0           # 전체 지형 바깥 테두리 폭 (m) - 시각 검증용이라 작게 유지
num_rows: 2                 # sub-terrain grid 행 수 (시각 검증용 소규모)
num_cols: 4                 # sub-terrain grid 열 수

horizontal_scale: 0.1       # x, y 이산화 간격 (m)
vertical_scale: 0.005       # z 이산화 간격 (m)
slope_threshold: 0.75       # 이 기울기 이상은 수직면으로 보정 (isaaclab 기본값)
color_scheme: height        # 높이 기반 색상 - 계단/경사 구분을 시각적으로 확인하기 위함

sub_terrains:
  pyramid_stairs:            # 오르막 계단 (연석 수준 2cm ~ 계단 챌판 25cm)
    type: mesh_pyramid_stairs
    proportion: 0.25
    step_height_range: [0.02, 0.25]
    step_width: 0.3
    platform_width: 2.0
    border_width: 1.0
    holes: false
  pyramid_stairs_inv:        # 내리막 계단
    type: mesh_pyramid_stairs_inv
    proportion: 0.25
    step_height_range: [0.02, 0.25]
    step_width: 0.3
    platform_width: 2.0
    border_width: 1.0
    holes: false
  pyramid_slope:              # 오르막 경사 (최대 tan(35도) ~= 0.7)
    type: hf_pyramid_slope
    proportion: 0.25
    slope_range: [0.0, 0.7]
    platform_width: 2.0
    border_width: 0.25
  pyramid_slope_inv:          # 내리막 경사
    type: hf_pyramid_slope_inv
    proportion: 0.25
    slope_range: [0.0, 0.7]
    platform_width: 2.0
    border_width: 0.25
  parkour_step:                # 파쿠르 단차 (평지 회복 구간을 둔 단일 단차 반복)
    type: parkour_step
    proportion: 0.25
    step_height_range: [0.05, 0.35]
    step_length: 0.4
    platform_length: 1.6
    num_steps: 3
  parkour_hurdle:              # 파쿠르 허들 (얇은 벽을 다리로 넘는 단일 장애물 반복)
    type: parkour_hurdle
    proportion: 0.25
    hurdle_height_range: [0.05, 0.2]
    hurdle_thickness: 0.1
    platform_length: 1.6
    num_hurdles: 3
