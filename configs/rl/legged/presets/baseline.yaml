# legged RL 설계 번들 - "어떤 로직을 쓸지 + 알고리즘 하이퍼파라미터 + 커리큘럼 파라미터"를 한 장에 모은다.
#
# robot yaml은 물리적 사실(usd·관절·액추에이터·기본 자세·reward_weights·reward_type·domain_randomization)만
# 담고, `rl_preset: baseline`으로 이 파일을 가리킨다. 4개 로봇이 같은 preset을 가리키면 embodiment 비교가
# 성립하고(학습 설계 동일), 실험용으로 다르게 하고 싶으면 이 파일을 복사해 새 preset을 만들어 그 로봇 yaml만
# 다른 이름을 가리키게 하면 된다.
#
# 각 로직 키는 scripts/sim/controller/legged/rl/{모듈}.py 의 레지스트리(OBSERVATION_SETS / REWARD_SETS /
# TERMINATION_SETS / EVENT_SETS / ACTION_BUILDERS)에 등록된 이름이어야 한다.

observations: proprio_heightscan     # 고유 감각 + height scan
rewards: rudin_parkour               # Rudin et al. 표준 9종 + Extreme Parkour 계단 전용 2종
                                     #  (light/standard 접촉 페널티 분기는 robot yaml의 reward_type이 정함)
terminations: base_contact           # 몸통(base) 이상 접촉 시 종료 (+ time_out은 코드가 항상 추가)
events: sim2real_default             # 마찰·질량·초기 상태·외란 도메인 랜덤화
action: joint_position              # 전 관절 위치제어

num_envs: 4096                       # 병렬 env 수 (tools/03_controller_rl.py --num-envs로 덮어쓸 수 있음)

# ---- PPO 러너 하이퍼파라미터 (Rudin et al., CoRL 2021/2022, arXiv:2109.11978 표준값) ----
# robot yaml에 agent: 블록이 있으면 그 키가 아래 값을 덮어쓴다(로봇별로 꼭 필요한 경우만 - 예: anymal 계열 entropy_coef).
algorithm:
  hidden_dims: [512, 256, 128]
  activation: elu
  init_noise_std: 1.0
  learning_rate: 1.0e-3
  schedule: adaptive
  desired_kl: 0.01
  entropy_coef: 0.01
  value_loss_coef: 1.0
  clip_param: 0.2
  num_learning_epochs: 5
  num_mini_batches: 4
  gamma: 0.99
  lam: 0.95
  max_grad_norm: 1.0
  num_steps_per_env: 24
  save_interval: 50
  # max_iterations 없음 - 학습 종료는 커리큘럼(수렴/정체/단계상한)이 정한다.

# ---- 커리큘럼: 쉬운 환경(평지)부터 시작 -> 수렴 판정 -> 다음 난이도 -> 수렴 실패까지 반복 ----
curriculum:
  # stage 번호 -> 지형 난이도 구간 (scripts/sim/env/curriculum/stage_env.py)
  # stage 1은 [base, base+increment], stage 2는 [base+increment, base+2*increment] ... 선형 증가
  stage:
    step_height_base_m: 0.03
    step_height_increment_m: 0.05
    slope_base_ratio: 0.10
    slope_increment_ratio: 0.15

  # 한 단계 안에서의 학습 진행 - eval_interval_iters 만큼 학습할 때마다 추종 정확도를 확인한다.
  per_stage:
    eval_interval_iters: 50
    max_iterations: 2000               # 이만큼 돌아도 수렴 못 하면 이 단계 포기(=커리큘럼 종료)

  # 수렴 판정: 가중치를 뺀 정규화 추종 보상(mean exp(-err^2/std^2) in [0,1])이 lin·ang 둘 다
  # threshold 이상인 상태가 patience_evals 회 연속되면 그 단계는 수렴한 것으로 본다.
  convergence:
    metric: track_lin_vel_xy_exp
    metric_secondary: track_ang_vel_z_exp
    threshold: 0.80
    patience_evals: 3

  # 정체 판정: 위 정규화 점수의 best 값이 window_evals 회 동안 min_delta 이상 개선되지 않으면
  # 이 단계는 더 못 깨는 것으로 보고 커리큘럼을 종료한다(고정 이터레이션 상한과 별개의 조기 종료).
  plateau:
    window_evals: 10
    min_delta: 0.01
