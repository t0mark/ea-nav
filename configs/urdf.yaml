# URDF 랜덤 생성 설정 (plan/urdf.md 기준)
# 생성 규모·스플릿은 학습 단계에서 확정하며 CLI 인자로 지정한다 (여기는 범위·검사 설정만)
# 파라미터 범위 원칙: 실로봇 풀(질량 약 1-265kg, 전장 약 0.14-1.9m)을 분포 지지범위가 포괄

generation:
  max_attempts: 30

# 정적 검사 임계값 (plan: 임계값·여유율 상수는 config로 관리)
validation:
  clearance_min: 0.012        # 접촉 링크 외 형상의 최소 지상고 [m]
  com_margin_min: 0.01        # 무게중심-지지 다각형 경계 최소 여유 [m]
  torque_margin: 1.1          # 토크 한계 >= 여유율 x 정적 중력 토크 (스윙 자중)
  stance_torque_margin: 1.2   # legged 전용: 토크 한계 >= 여유율 x 스탠스(절반 다리 지지) 토크
  contact_band: 0.008         # 접촉점으로 인정하는 최저점 밴드 [m]
  contact_coplanar_tol: 0.008 # 접지 유닛별 최저점 산포 허용치 [m] (롤러 위상 잔차 포함)
  load_share_min: 0.35        # 구동축 정적 하중 비율 하한 (diff/ackermann)
  overturn_max: 8.0           # 전복 비율 상한 = 무게중심 높이 / 다각형 경계 여유
  balancing:                  # 2륜 balancing 전용 (plan diff 섹션)
    com_line_tol: 0.03        # 무게중심-축선 수평 편차 허용 [m]
    min_com_above: 0.02       # 무게중심이 축보다 위에 있어야 하는 최소 높이 [m]
    theta_max: 0.3            # 복원을 보장할 최대 기울기 [rad]
    torque_margin: 1.2        # 복원 토크 여유율

diff:
  body_shapes: [box, cylinder, cylinder_stack]
  body_length: [0.12, 1.2]
  body_width: [0.1, 0.9]
  body_height: [0.05, 0.5]
  wheel_radius: [0.02, 0.28]
  wheel_width_factor: [0.3, 0.7]     # 바퀴 폭 = 반지름 x 계수
  body_density: [80, 600]            # 유효 밀도 [kg/m^3] (내부 공동 감안)
  wheel_density: [300, 1500]
  caster_kinds: [none, ball, swivel] # none = 2륜 balancing

skid:
  body_shapes: [box, stack]
  body_length: [0.15, 1.2]
  body_width: [0.12, 0.9]
  body_height: [0.06, 0.5]
  wheel_radius: [0.03, 0.28]
  wheel_width_factor: [0.3, 0.7]
  wheelbase_factor: [0.55, 0.95]     # 휠베이스 = 몸통 길이 x 계수
  wb_track_ratio_max: 1.5            # 휠베이스:트랙 비율 상한 (제자리 회전 저항)
  body_density: [80, 600]
  wheel_density: [300, 1500]

ackermann:
  body_shapes: [box, stack]
  body_length: [0.25, 1.2]
  body_width: [0.15, 0.8]
  body_height: [0.06, 0.5]
  wheel_radius: [0.03, 0.25]
  wheel_width_factor: [0.3, 0.7]
  wheelbase_factor: [0.55, 0.95]
  turn_radius_factor: 4.0            # 최소 회전 반경 <= 계수 x 몸통 길이
  body_density: [80, 600]
  wheel_density: [300, 1500]

omni:
  body_shapes: [box, stack, cylinder]
  subtypes: [mecanum4, omni3, omni4]
  body_length: [0.2, 1.0]
  body_width: [0.15, 0.8]
  body_height: [0.06, 0.45]
  wheel_radius: [0.03, 0.18]
  wheel_width_factor: [0.35, 0.7]
  wheelbase_factor: [0.5, 0.9]
  body_density: [80, 600]
  wheel_density: [300, 1500]

# 보행 요구 연동 상수 (multileg·humanoid 공유 — 토크·속도 하한을 보행 물리에 앵커.
# 근거: 독립 분석에서 스윙 자중 기준 하한이 트롯 스탠스 하중 미달 개체를 통과시킨 결함)
gait:
  stance_margin: [1.25, 3.0]  # 토크 = 스탠스 정적 요구 x 여유율 (샘플 범위)
  arm_min_frac: 0.35          # 스탠스 모멘트 팔 하한 = 계수 x 관절 아래 도달 길이 (보폭 자세 대비)
  froude: 0.6                 # v_max = froude x sqrt(g x 기립고) — rl.yaml cmd.froude 정합
  froude_biped: 0.35          # humanoid 별도 (rl.yaml forms.humanoid.cmd.froude 정합)
  vel_margin: 1.3             # 속도 하한 = 여유율 x 스윙 피크 요구 (pi x v_max / 다리 전장)
  vel_hi: 15.0                # 속도 상한 기본값 (multileg. 상한 = max(vel_hi, vel_span x 하한))
  vel_hi_biped: 12.0          # humanoid 속도 상한 기본값
  vel_span: 1.6

multileg:
  body_length: [0.2, 1.1]
  body_width: [0.12, 0.6]
  body_height: [0.06, 0.32]
  seg_length_factor: [0.25, 0.75]    # 세그먼트 길이 = 몸통 길이 x 계수 (세그별 독립)
  body_density: [100, 900]
  limb_density: [250, 1500]

humanoid:
  pelvis_depth: [0.07, 0.28]
  pelvis_width: [0.1, 0.42]
  pelvis_height: [0.05, 0.2]
  torso_depth: [0.08, 0.3]
  torso_width: [0.12, 0.5]
  torso_height: [0.12, 0.65]
  head_radius: [0.04, 0.13]
  thigh_length: [0.1, 0.55]
  shin_length: [0.1, 0.55]
  foot_length: [0.08, 0.34]
  foot_width: [0.05, 0.16]
  upper_arm_length: [0.08, 0.38]
  forearm_length: [0.07, 0.35]
  body_density: [150, 2200]          # 상한 확대: 구동기 밀집 대형기 (atlas급) 대응
  limb_density: [300, 2200]

wheeled_humanoid:
  base_types: [diff, skid, omni]     # balancing 서브타입은 상속에서 제외 (생성기 처리)
  torso_height: [0.2, 0.8]
  lift_stroke: [0.1, 0.4]
  head_radius: [0.04, 0.12]
  upper_arm_length: [0.12, 0.4]
  forearm_length: [0.1, 0.35]
  body_density: [150, 1000]
