# fan-ziqi/robot_lab 공식 리포(config/quadruped/unitree_b2/rough_env_cfg.py + agents/rsl_rl_ppo_cfg.py
# + assets/unitree.py)를 재클론해 재검증 후 반영했다. contact_forces·feet_contact_without_cmd·
# joint_power·upward는 이후 레지스트리에 구현해 반영함(실측: upward 없이 학습시켰더니 뒤집힌 채
# 정지하는 정책으로 수렴 - model_850 비디오로 확인). joint_pos_penalty·feet_height_body는 아직
# 레지스트리에 없어 뺐다.
usd_path: unitree_b2.usd
base_body_name: base_link
foot_body_names: FL_foot|FL_thigh_protect|FR_foot|FR_thigh_protect|RL_foot|RL_thigh_protect|RR_foot|RR_thigh_protect
undesired_contact_body_names: FL_calf|FL_thigh|FR_calf|FR_thigh|RL_calf|RL_thigh|RR_calf|RR_thigh
actuator:
  type: simple
  stiffness: 160.0
  damping: 5.0
action:
  type: position_only
  scale: {".*_hip_joint": 0.125, "^(?!.*_hip_joint).*$": 0.25}
rewards:
- name: track_lin_vel_xy_exp
  weight: 3.0
- name: track_ang_vel_z_exp
  weight: 1.5
- name: lin_vel_z_l2
  weight: -2.0
- name: ang_vel_xy_l2
  weight: -0.05
- name: dof_torques_l2
  weight: -1.0e-05
- name: dof_acc_l2
  weight: -1.0e-07
- name: action_rate_l2
  weight: -0.01
- name: dof_pos_limits
  weight: -5.0
- name: stand_still
  weight: -2.0
- name: undesired_contacts
  weight: -1.0
- name: contact_forces
  weight: -1.5e-04
- name: joint_power
  weight: -1.0e-05
- name: feet_contact_without_cmd
  weight: 0.1
- name: upward
  weight: 3.0
- name: joint_mirror
  weight: -0.05
  params:
    mirror_joints:
    - [FR_(hip|thigh|calf).*, RL_(hip|thigh|calf).*]
    - [FL_(hip|thigh|calf).*, RR_(hip|thigh|calf).*]
default_joint_pos:
  FL_calf_joint: -1.625
  FR_calf_joint: -1.625
  RL_calf_joint: -1.625
  RR_calf_joint: -1.625
termination:
- name: orientation
  limit_angle: 0.7
# 원본은 illegal_contact 종료조건만 끄고, upward 보상(위에 추가함)만으로 낙상을 억제한다.
# 우리는 upward 보상을 추가한 뒤에도 orientation 종료조건을 함께 둔다 - 둘 다 같은 방향(뒤집힘 억제)
# 이라 상충하지 않고, 종료조건이 있으면 나쁜 자세에서 더 빨리 에피소드를 끝내 학습이 더 안정적이다.
policy_architecture: mlp
algorithm: ppo
domain_randomization: basic
agent:
  num_envs: 4096
  max_iterations: 20000
  learning_rate: 0.001
  entropy_coef: 0.01
  hidden_dims: [512, 256, 128]
