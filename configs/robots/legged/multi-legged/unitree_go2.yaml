# Isaac Lab 공식 UNITREE_GO2_CFG를 그대로 반영 - 물리적 사실(액추에이터·기본 자세)만 여기 담는다.
# 관측/보상/종료조건/이벤트/액션 로직 선택·PPO 하이퍼파라미터·커리큘럼 파라미터는 rl_preset이 가리키는
# configs/rl/legged/presets/baseline.yaml 이 정한다.
rl_preset: baseline
usd_path: unitree_go2.usd
base_body_name: base
foot_body_names: FL_foot|FR_foot|RL_foot|RR_foot
undesired_contact_body_names: FL_calf|FR_calf|RL_calf|RR_calf
hip_joint_names: .*_hip_joint
actuator:
  model: dc_motor  # 토크·속도 포화가 있는 실제 모터 모델
  stiffness: 25.0
  damping: 0.5
  effort_limit: 23.5
  saturation_effort: 23.5
  velocity_limit: 30.0
# 스폰 시 베이스 높이(m) - Isaac Lab 공식 UNITREE_GO2_CFG.init_state.pos 값 그대로.
# 비워두면 usd의 authored 자세 bbox로 추정하는데, 이 로봇의 기본 자세는 웅크린 자세라
# 추정값이 몇 cm 높게 잡혀 리셋마다 낙하한다.
spawn_height: 0.40
action_scale: 0.25
default_joint_pos_complete: true
default_joint_pos:
  FL_hip_joint: 0.1
  RL_hip_joint: 0.1
  FR_hip_joint: -0.1
  RR_hip_joint: -0.1
  FL_thigh_joint: 0.8
  FR_thigh_joint: 0.8
  RL_thigh_joint: 1.0
  RR_thigh_joint: 1.0
  FL_calf_joint: -1.5
  FR_calf_joint: -1.5
  RL_calf_joint: -1.5
  RR_calf_joint: -1.5
# Isaac Lab 공식 config/go2/rough_env_cfg.py가 부모(velocity_env_cfg.py) 기본값 위에 거는 오버라이드
# 그대로 - push_robot을 끄고, 리셋 시 베이스 속도 랜덤화도 꺼서 위치·yaw만 랜덤화된 채로 스폰하고,
# 관절 초기 자세 랜덤화도 꺼서(1.0=고정) 정확한 기본 자세로 시작하며, 베이스 질량은 곱연산이 아니라
# -1.0~+3.0kg 덧셈으로 흔든다.
domain_randomization:
  reset_joint_position_range: [1.0, 1.0]
  push_robot: false
  reset_base_velocity_range:
    x: [0.0, 0.0]
    y: [0.0, 0.0]
    z: [0.0, 0.0]
    roll: [0.0, 0.0]
    pitch: [0.0, 0.0]
    yaw: [0.0, 0.0]
  add_base_mass:
    range: [-1.0, 3.0]
    operation: add
# light_quadruped: 가볍고 토크가 작은 4족이라 undesired_contacts(허벅지·정강이 접촉 벌점)를 켜두면
# 정상 보행 중의 스침까지 벌점 먹어 "안 움직이는" local optimum에 빠진다 - Isaac Lab 공식
# config/go2/rough_env_cfg.py도 이 항목을 끈다(scripts/.../rl/rewards.py의 LightQuadrupedRewards).
reward_type: light_quadruped
# track_lin_vel_xy_exp/track_ang_vel_z_exp/feet_air_time/dof_torques_l2는 Isaac Lab 공식
# config/go2/rough_env_cfg.py가 부모(velocity_env_cfg.py) 기본값 위에 실제로 거는 오버라이드
# 값 그대로(1.5/0.75/0.01/-0.0002 - go2 실제 토크 스케일 23.5N·m에 맞춘 값). 나머지(lin_vel_z_l2 등)는
# 공식이 안 건드리는 부모 기본값 그대로. feet_stumble/hip_pos는 Isaac Lab 공식에 없는 이 프로젝트의
# Extreme Parkour 포팅 항목이라 대조할 공식 값이 없음 - 기존에 쓰던 값을 유지한다.
reward_weights:
  track_lin_vel_xy_exp: 1.5
  track_ang_vel_z_exp: 0.75
  lin_vel_z_l2: -2.0
  ang_vel_xy_l2: -0.05
  dof_torques_l2: -0.0002
  dof_acc_l2: -2.5e-7
  action_rate_l2: -0.01
  feet_air_time: 0.01
  feet_stumble: -1.0
  hip_pos: -0.5
# agent: 블록은 preset.algorithm 기본값과 달라야 하는 키가 있을 때만 둔다(go2는 preset 기본값 그대로라 없음).
