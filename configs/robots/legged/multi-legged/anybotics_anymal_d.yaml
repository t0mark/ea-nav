# Isaac Lab 공식 ANYMAL_D_CFG를 그대로 반영 - 물리적 사실만 여기 담는다.
# foot_body_names는 SHANK다 - 이 USD에는 별도 FOOT 링크가 없다(실측: ManagerBasedRLEnv 생성 시
# "Available strings"에 HIP/THIGH/SHANK만 나열됨).
# 액추에이터는 공식이 쓰는 ANYDRIVE_3_LSTM_ACTUATOR_CFG(학습된 신경망 모델)를 이 프로젝트 골격
# (implicit/dc_motor)으로 재현할 수 없어, 같은 파일의 폴백 DC 모터 값(ANYDRIVE_3_SIMPLE_ACTUATOR_CFG)을
# 그대로 쓴다 - LSTM만큼 정밀하진 않아도 최소한 실제 ANYdrive와 같은 토크·속도 포화는 반영된다.
# 학습 설계는 rl_preset이 가리키는 configs/rl/legged/presets/baseline.yaml 이 정한다.
rl_preset: baseline
usd_path: anybotics_anymal_d.usd
base_body_name: base
foot_body_names: LF_FOOT|LH_FOOT|RF_FOOT|RH_FOOT
undesired_contact_body_names: LF_THIGH|LH_THIGH|RF_THIGH|RH_THIGH
hip_joint_names: .*HAA
# 이 USD에는 다리 12관절(HAA/HFE/KFE) 외에 카메라 페이로드 마운트 관절
# (inspection_payload_mount_to_pan/pan_to_tilt)이 2개 더 있다 - Isaac Lab 공식 액추에이터
# (ANYDRIVE_3_LSTM_ACTUATOR_CFG)도 다리만 구동하고 페이로드 관절은 액추에이터가 없어, 우리도
# 다리 12관절만 지정한다(전 관절로 두면 페이로드 관절까지 액션 공간에 들어가 정책이 불필요하게
# 그것까지 제어하게 됨).
controlled_joint_names: .*(HAA|HFE|KFE)
actuator:
  model: dc_motor  # ANYDRIVE_3_SIMPLE_ACTUATOR_CFG 값 그대로 - 토크·속도 포화가 있는 실제 모터 모델
  stiffness: 40.0
  damping: 5.0
  effort_limit: 80.0
  saturation_effort: 120.0
  velocity_limit: 7.5
# 스폰 시 베이스 높이(m) - Isaac Lab 공식 ANYMAL_D_CFG.init_state.pos 값 그대로.
# 비워두면 usd의 authored 자세 bbox로 추정하는데, 이 로봇의 기본 자세는 웅크린 자세라
# 추정값이 몇 cm 높게 잡혀 리셋마다 낙하한다.
spawn_height: 0.60
action_scale: 0.5
# Isaac Lab 공식 ANYMAL_D_CFG.init_state.joint_pos 그대로 - 앞다리/뒷다리 HFE·KFE 부호가 반대라
# 굽힌 자세로 선다.
default_joint_pos_complete: true
default_joint_pos:
  .*HAA: 0.0
  .*F_HFE: 0.4
  .*H_HFE: -0.4
  .*F_KFE: -0.8
  .*H_KFE: 0.8
# anymal_d/rough_env_cfg.py는 부모(velocity_env_cfg.py) 이벤트를 하나도 오버라이드하지 않는다 -
# 공식 기본값(덧셈 -5~+5kg)을 그대로 쓴다.
domain_randomization:
  add_base_mass:
    range: [-5.0, 5.0]
    operation: add
# 허벅지·정강이 접촉을 하중 지지로 볼 임계(N) - 체중 57.0kg의 1/4(140N)이다.
# 이 값 아래의 스침은 벌점이 아니고, 그 부위로 딛고 서는 자세만 걸린다.
undesired_contact_threshold_n: 140
# 스윙 중 발이 지면에서 떨어져야 할 목표 높이(m) - 공식 Spot 태스크가 기립 0.5m에 0.10m를
# 쓰는 비율(스폰 높이의 0.20배)을 이 로봇 스폰 높이 0.6m에 적용한 값이다.
foot_clearance_target_m: 0.12
reward_weights:
  track_lin_vel_xy_exp: 1.0
  track_ang_vel_z_exp: 0.5
  lin_vel_z_l2: -2.0
  ang_vel_xy_l2: -0.05
  dof_torques_l2: -1.0e-5
  dof_acc_l2: -2.5e-7
  action_rate_l2: -0.01
  feet_air_time: 0.125
  undesired_contacts: -1.0
  feet_clearance: -0.1
  flat_orientation_l2: -1.0
  feet_stumble: -0.5
  hip_pos: -0.5
