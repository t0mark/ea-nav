# IsaacLab 공식(anymal_d/rough_env_cfg.py, base는 velocity_env_cfg.py 그대로)을 재클론해 재검증
# 후 반영했다. foot_body_names가 SHANK로 잘못돼 있었고 게다가 collision이 아예 없는
# inspection_payload_tilt(카메라 짐벌 부품)까지 "발"로 잘못 섞여 있던 것을 로컬 URDF 대조로 확인해
# FOOT으로 고치고 payload는 뺐다. undesired_contact_body_names도 THIGH(collision 없음)를
# thigh_fixed(실제 collision 프록시)로 고쳤다(inspection_payload_pan은 실제로 collision이 있어
# 그대로 유지). damping도 legged_gym 실측값(2.0)으로 맞췄다. flat_orientation_l2/dof_pos_limits는
# IsaacLab rough 기본값이 0.0(비활성)이라 제거.
usd_path: anybotics_anymal_d.usd
base_body_name: base
foot_body_names: LF_FOOT|LH_FOOT|RF_FOOT|RH_FOOT
undesired_contact_body_names: LF_thigh_fixed|LH_thigh_fixed|RF_thigh_fixed|RH_thigh_fixed|inspection_payload_pan
actuator:
  type: simple
  stiffness: 80.0
  damping: 2.0
action:
  type: position_only
  scale: 0.5
rewards:
- name: track_lin_vel_xy_exp
  weight: 1.0
- name: track_ang_vel_z_exp
  weight: 0.5
- name: lin_vel_z_l2
  weight: -2.0
- name: ang_vel_xy_l2
  weight: -0.05
- name: dof_torques_l2
  weight: -1.0e-05
- name: dof_acc_l2
  weight: -2.5e-07
- name: action_rate_l2
  weight: -0.01
- name: feet_air_time_multi
  weight: 0.125
  params:
    threshold: 0.5
- name: undesired_contacts
  weight: -1.0
  params:
    threshold: 1.0
termination:
- contact
policy_architecture: mlp
algorithm: ppo
domain_randomization: basic
agent:
  num_envs: 4096
  max_iterations: 1500
  learning_rate: 0.001
  entropy_coef: 0.005
  hidden_dims: [512, 256, 128]
