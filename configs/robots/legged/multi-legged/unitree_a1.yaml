# Isaac Lab 공식 UNITREE_A1_CFG를 그대로 반영 - 물리적 사실만 여기 담는다.
# URDF의 "base" 링크는 질량 0짜리 더미 참조 프레임이다(visual만 있고 inertial/collision 없음).
# 실제 몸통은 "trunk" 링크다 - Isaac Lab 공식 config/a1/rough_env_cfg.py도 height_scanner/
# add_base_mass/base_contact를 전부 trunk에 건다.
usd_path: unitree_a1.usd
base_body_name: trunk
foot_body_names: FL_foot|FR_foot|RL_foot|RR_foot
undesired_contact_body_names: FL_thigh|FR_thigh|RL_thigh|RR_thigh
hip_joint_names: .*_hip_joint
actuator:
  model: dc_motor
  stiffness: 25.0
  damping: 0.5
  effort_limit: 33.5
  saturation_effort: 33.5
  velocity_limit: 21.0
# 스폰 시 베이스 높이(m) - Isaac Lab 공식 UNITREE_A1_CFG.init_state.pos 값 그대로.
# 비워두면 usd의 authored 자세 bbox로 추정하는데, 이 로봇의 기본 자세는 웅크린 자세라
# 추정값이 몇 cm 높게 잡혀 리셋마다 낙하한다.
spawn_height: 0.42
# 좌우 벌림 관절만 액션 스케일을 낮춘다 - hip이 크게 벌어지면 네 발이 만드는 지지 다각형이 좁아져
# 자세가 무너지고, hip_pos 벌점이 추종 보상을 덮어 제자리에 서 있는 국소 최적이 잡힌다.
# 나머지 관절은 Isaac Lab 공식 UNITREE_A1_CFG의 0.25를 그대로 쓴다.
action_scale:
  .*_hip_joint: 0.125
  ^(?!.*_hip_joint).*$: 0.25
# Isaac Lab 공식 UNITREE_A1_CFG.init_state.joint_pos 그대로
default_joint_pos_complete: true
default_joint_pos:
  .*L_hip_joint: 0.1
  .*R_hip_joint: -0.1
  FL_thigh_joint: 0.8
  FR_thigh_joint: 0.8
  RL_thigh_joint: 1.0
  RR_thigh_joint: 1.0
  .*_calf_joint: -1.5
# Isaac Lab 공식 config/a1/rough_env_cfg.py 오버라이드 그대로
domain_randomization:
  reset_joint_position_range: [1.0, 1.0]
  push_robot: false
  reset_base_velocity_range:
    x: [0.0, 0.0]
    y: [0.0, 0.0]
    z: [0.0, 0.0]
    roll: [0.0, 0.0]
    pitch: [0.0, 0.0]
    yaw: [0.0, 0.0]
  add_base_mass:
    range: [-1.0, 3.0]
    operation: add
# 허벅지·정강이 접촉을 하중 지지로 볼 임계(N) - 체중 13.7kg의 1/4(34N)이다.
# 이 값 아래의 스침은 벌점이 아니고, 그 부위로 딛고 서는 자세만 걸린다.
undesired_contact_threshold_n: 34
# 스윙 중 발이 지면에서 떨어져야 할 목표 높이(m) - 공식 Spot 태스크가 기립 0.5m에 0.10m를
# 쓰는 비율(스폰 높이의 0.20배)을 이 로봇 스폰 높이 0.42m에 적용한 값이다.
foot_clearance_target_m: 0.08
# track_lin_vel_xy_exp/track_ang_vel_z_exp/feet_air_time/dof_torques_l2는 Isaac Lab 공식
# config/a1/rough_env_cfg.py가 부모(velocity_env_cfg.py) 기본값 위에 실제로 거는 오버라이드 값
# 그대로(1.5/0.75/0.01/-0.0002 - a1 실제 토크 스케일 33.5N·m에 맞춘 값). 나머지(lin_vel_z_l2 등)는
# 공식이 안 건드리는 부모 기본값 그대로. feet_stumble/hip_pos는 Isaac Lab 공식에 없는 이 프로젝트의
# Extreme Parkour 포팅 항목이라 대조할 공식 값이 없음 - 기존에 쓰던 값을 유지한다.
reward_weights:
  track_lin_vel_xy_exp: 1.5
  track_ang_vel_z_exp: 0.75
  lin_vel_z_l2: -2.0
  ang_vel_xy_l2: -0.05
  dof_torques_l2: -2.0e-4
  dof_acc_l2: -2.5e-7
  action_rate_l2: -0.01
  feet_air_time: 0.01
  undesired_contacts: -1.0
  feet_clearance: -0.1
  flat_orientation_l2: -1.0
  feet_stumble: -0.5
  hip_pos: -0.5
