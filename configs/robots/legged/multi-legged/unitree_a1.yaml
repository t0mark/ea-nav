usd_path: unitree_a1.usd
base_body_name: base
foot_body_names: FL_foot|FR_foot|RL_foot|RR_foot
undesired_contact_body_names: FL_calf|FR_calf|RL_calf|RR_calf
actuator:
  type: simple
  stiffness: 25.0
  damping: 0.5
action:
  type: position_only
  scale: 0.25
rewards:
- name: track_lin_vel_xy_exp
  weight: 1.5
- name: track_ang_vel_z_exp
  weight: 0.75
- name: lin_vel_z_l2
  weight: -2.0
- name: ang_vel_xy_l2
  weight: -0.05
- name: dof_torques_l2
  weight: -0.0002
- name: dof_acc_l2
  weight: -2.5e-07
- name: action_rate_l2
  weight: -0.01
- name: feet_air_time_multi
  weight: 0.01
  params:
    threshold: 0.5
default_joint_pos:
  FL_calf_joint: -103.49999
  FR_calf_joint: -103.49999
  RL_calf_joint: -103.49999
  RR_calf_joint: -103.49999
termination:
- contact
policy_architecture: mlp
algorithm: ppo
domain_randomization: basic
agent:
  num_envs: 4096
  max_iterations: 1500
  learning_rate: 0.001
  entropy_coef: 0.01
  hidden_dims:
  - 512
  - 256
  - 128
