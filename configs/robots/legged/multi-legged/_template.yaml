# 다족보행(quadruped 등) 로봇 RL 보행 정책 파라미터 스키마
# scripts/sim/controller/legged/rl/loco_rl_env.py의 LeggedRobotCfg와 1:1 대응
# 실제 값(본체·발 링크 이름 등)은 로봇 USD를 확인해 채운다 (여기서는 필드 자리만 정의)

usd_path: null                       # data/sim/usd/real_robot/legged/multi-legged/ 밑의 파일명만
morphology_group: quadruped          # rewards.py의 보상 세트 선택 기준
base_body_name: null                 # 몸통 링크 이름 (base contact 종료 조건, base mass 랜덤화, height scanner 부착점)
foot_body_names: null                # 발 링크 이름 정규식 (contact sensor, feet_air_time 보상)
undesired_contact_body_names: null   # 지면에 닿으면 안 되는 링크 정규식 (허벅지/무릎 등)
action_scale: 0.5                    # 관절 위치 액션 스케일
default_joint_pos: {}                # 기본 자세 0이 리밋을 벗어나는 관절만 {관절 이름: 리밋 중앙값} (예: 무릎)
