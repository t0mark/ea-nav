# 다족보행(4족 등) 로봇 RL 보행 정책 - robot yaml 스키마
# scripts/sim/controller/legged/rl/robot_profile.py 의 RobotProfile 과 1:1 대응.
#
# 이 파일에는 "로봇마다 실제로 다른 물리적 사실"만 담는다:
#   usd 경로 · 바디/관절 이름 · 액추에이터 수치 · 기본 자세 · 도메인 랜덤화 값 ·
#   reward_type(몸집 부류) · reward_weights(로봇 토크 스케일에 맞춘 가중치).
# 학습 "설계"(어떤 관측/보상/종료/이벤트/액션 로직을 쓸지 + PPO 하이퍼파라미터 + 커리큘럼 파라미터)는
# 여기 없다 - rl_preset 이 가리키는 configs/rl/legged/presets/{preset}.yaml 이 정한다. 4개 로봇이 같은
# preset 을 가리키면 embodiment 비교가 성립한다(학습 설계 동일).
#
# 값은 이 로봇의 실제 오픈소스 학습 리포(Isaac Lab 공식 config 등)와 대조해 채우는 게 원칙이고,
# 대조 대상이 없으면 가장 비슷한 골격의 검증된 로봇 레시피로 대체하고 그 이유를 주석으로 남긴다.

# ---- RL 설계 번들 선택 ----
rl_preset: baseline                  # configs/rl/legged/presets/{이 이름}.yaml (생략 시 "baseline")

# ---- USD & 링크 이름 ----
usd_path: null                       # data/sim/usd/real_robot/legged/multi-legged/ 밑의 파일명만
base_body_name: null                 # 몸통 링크 (base contact 종료 · base mass 랜덤화 · height scanner 부착점)
foot_body_names: null                # 발 링크 정규식, "A|B|C|D" (contact sensor · feet_air_time · feet_stumble)
undesired_contact_body_names: null   # 지면에 닿으면 안 되는 링크 정규식 (허벅지/정강이 등 - standard_quadruped 의 undesired_contacts 가 씀)
hip_joint_names: null                # 힙(외전) 관절 정규식, 예: ".*_hip_joint" / ".*HAA" (hip_pos 보상이 씀)

# 다리 관절 외에 별도 액추에이터가 없는 관절(카메라 페이로드 마운트 등)이 USD 에 더 있을 때만 좁힌다.
# 그런 관절이 없으면 이 줄을 통째로 지운다(그러면 ".*" - 전 관절). actuator 와 action 이 이 집합을 공유한다.
controlled_joint_names: .*(HAA|HFE|KFE)

# ---- 기본 자세 ----
# default_joint_pos_complete = false(기본): default_joint_pos 는 "0 이 관절 리밋을 벗어나는 관절만" 담은
#   override 목록. 나머지 관절은 코드가 0.0 으로 채운다(usd_export_config.py 자동 생성물이 이 형태).
# default_joint_pos_complete = true: default_joint_pos 가 이미 로봇 전 관절의 기본 자세다(Isaac Lab
#   공식 자세를 그대로 이식한 경우). 잘못 두면 학습 시작 시 "정규식이 매칭 안 됨" 에러가 난다.
default_joint_pos_complete: true
default_joint_pos:
  .*HAA: 0.0
  .*F_HFE: 0.4
  .*H_HFE: -0.4
  .*F_KFE: -0.8
  .*H_KFE: 0.8

# ---- 액추에이터 (scripts/.../rl/actuator.py) ----
# model: implicit  -> 포화 없는 순수 PD. 필요한 키: stiffness, damping   (ANYmal-D/Spot 공식)
# model: dc_motor  -> 토크·속도 포화가 있는 실제 모터. 추가 키: effort_limit, velocity_limit,
#                     (선택) saturation_effort[기본 effort_limit], friction[기본 0.0]   (Unitree Go2/A1 공식)
actuator:
  model: implicit
  stiffness: 80.0
  damping: 2.0

action_scale: 0.5                    # 정책 출력에 곱해 기본 자세 오프셋으로 더할 비율 (생략 시 0.25)

# ---- 도메인 랜덤화 (scripts/.../rl/event.py, preset events="sim2real_default") ----
# 아래 키만 오버라이드할 수 있고, 넣지 않으면 코드 기본값을 쓴다:
#   add_base_mass: {range: [lo, hi], operation: add|scale[기본 scale], distribution: uniform|log_uniform[기본 uniform]}
#   reset_joint_position_range: [lo, hi]        관절 초기 자세 배율 (기본 [0.5, 1.5], [1.0, 1.0]=고정)
#   reset_base_velocity_range: {x: [lo,hi], y:, z:, roll:, pitch:, yaw:}   리셋 초기 속도 (기본 전 축 ±0.5)
#   push_robot: false                          주행 중 무작위 밀기 이벤트를 끈다 (기본 켜짐)
domain_randomization:
  add_base_mass:
    range: [-5.0, 5.0]
    operation: add

# ---- 보상 부류 (scripts/.../rl/rewards.py, preset rewards="rudin_parkour") ----
# light_quadruped    : 가볍고 토크가 작은 4족(Go2/A1 등) - undesired_contacts 를 안 켠다
#                      (정상 보행 스침까지 벌점 먹어 "안 움직이는" local optimum 에 빠지므로. Isaac Lab 공식 go2/a1 도 끈다)
# standard_quadruped : 무겁고 토크가 큰 4족(ANYmal-D/Spot 등) - undesired_contacts 를 켠다
reward_type: standard_quadruped

# ---- 보상 가중치 ----
# rewards.py 는 아래 키를 그대로 읽고 코드 쪽 기본값을 두지 않는다(빠지면 KeyError). 항목별 함수는
# preset 의 rewards 세트가 정하고, 여기서는 "이 로봇 토크 스케일에 맞춘 숫자"만 준다.
# undesired_contacts 는 reward_type=standard_quadruped 일 때만 필요하다(light 면 이 줄을 지운다).
reward_weights:
  track_lin_vel_xy_exp: 1.0
  track_ang_vel_z_exp: 0.5
  lin_vel_z_l2: -2.0
  ang_vel_xy_l2: -0.05
  dof_torques_l2: -1.0e-5
  dof_acc_l2: -2.5e-7
  action_rate_l2: -0.01
  feet_air_time: 0.125
  undesired_contacts: -1.0            # standard_quadruped 전용
  feet_stumble: -1.0                  # Extreme Parkour 포팅 항목
  hip_pos: -0.5                       # Extreme Parkour 포팅 항목

# ---- PPO 하이퍼파라미터 오버라이드 (선택) ----
# preset.algorithm 기본값 위에 이 로봇만 달라야 하는 키만 덮어쓴다. 없으면 이 블록 전체를 지운다.
# (num_envs·max_iterations 는 여기 두지 않는다 - num_envs 는 preset, 학습량은 커리큘럼이 정한다.)
agent:
  entropy_coef: 0.005                 # 예: ANYmal 계열은 Isaac Lab 공식이 낮은 entropy 를 쓴다
