# DeepRobotics 공식 리포(DeepRoboticsLab/rl_training) rough_env_cfg.py + assets/deeprobotics.py
# 세팅을 재클론해 재검증 후 반영했다(actuator 24.0/0.48 -> 30.0/1.0로 수정, termination에서
# illegal_contact 종료조건 제거 - 원본이 꺼둠). phase_foot_trajectory_exp·feet_air_time_lin_xy/
# ang_z·joint_power·contact_forces·feet_contact_without_cmd는 이 리포 전용 커스텀 보상 함수라
# 우리 rewards/ 레지스트리에 없어 뺐다 - 나머지(속도추종·자세·발 접촉·게이트·좌우대칭)는 전부 실제
# weight 그대로 반영했다.
usd_path: deeprobotics_lite3.usd
base_body_name: TORSO
foot_body_names: FL_FOOT|FR_FOOT|HL_FOOT|HR_FOOT
undesired_contact_body_names: FL_SHANK|FR_SHANK|HL_SHANK|HR_SHANK
actuator:
  type: simple
  stiffness: 30.0
  damping: 1.0
action:
  type: position_only
  scale: {".*_HipX_joint": 0.125, "^(?!.*_HipX_joint).*$": 0.25}
rewards:
- name: track_lin_vel_xy_exp
  weight: 4.0
- name: track_ang_vel_z_exp
  weight: 1.5
- name: lin_vel_z_l2
  weight: -20.0
- name: ang_vel_xy_l2
  weight: -0.25
- name: dof_torques_l2
  weight: -2.5e-04
- name: dof_acc_l2
  weight: -1.0e-08
- name: action_rate_l2
  weight: -0.1
- name: flat_orientation_l2
  weight: -20.0
- name: dof_pos_limits
  weight: -5.0
- name: base_height_l2
  weight: -50.0
  params:
    target_height: 0.55
- name: undesired_contacts
  weight: -0.5
- name: feet_slide
  weight: -0.05
- name: stand_still
  weight: -0.5
  params:
    joint_names: .*_HipX_joint|.*_HipY_joint|.*_Knee_joint
- name: feet_gait
  weight: 0.5
  params:
    synced_feet_pair_names:
    - [FL_FOOT, HR_FOOT]
    - [FR_FOOT, HL_FOOT]
- name: joint_mirror
  weight: -0.05
  params:
    mirror_joints:
    - [FL_(HipX|HipY|Knee).*, HR_(HipX|HipY|Knee).*]
    - [FR_(HipX|HipY|Knee).*, HL_(HipX|HipY|Knee).*]
- name: joint_deviation_l1
  weight: -0.4
  params:
    joint_names: .*_HipX_joint
- name: joint_deviation_l1
  weight: -2.0
  params:
    joint_names: .*_Knee_joint
default_joint_pos:
  FL_Knee_joint: 94.9964
  FR_Knee_joint: 94.9964
  HL_Knee_joint: 94.9964
  HR_Knee_joint: 94.9964
termination: []  # 원본이 illegal_contact 종료조건 자체를 꺼둔다(전도는 보상 페널티로만 다룸)
policy_architecture: mlp
algorithm: ppo
domain_randomization:
  type: extended
agent:
  num_envs: 4096
  max_iterations: 10000
  learning_rate: 0.001
  entropy_coef: 0.01
  hidden_dims: [512, 256, 128]
