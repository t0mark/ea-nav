# DeepRobotics Lite3 - 물리적 사실만 여기 담는다.
# 이 로봇은 Isaac Lab 공식 자산에 없고 제조사 리포(DeepRoboticsLab/rl_training)가 공식 참조인데,
# 그쪽은 보상 설계 자체가 다르다(feet_air_time_lin_xy/joint_power/feet_gait/joint_mirror/
# phase_foot_trajectory_exp 등). 이 프로젝트는 4족 전체가 같은 preset(rudin_parkour)을 공유해야
# embodiment 비교가 성립하므로, 보상은 같은 경량 4족인 go2/a1과 동일한 세트를 쓰고 제조사 고유
# 보상 설계는 재현하지 않는다. 액추에이터·관절 리밋 같은 물리적 사실만 URDF 실측값으로 반영한다.
rl_preset: baseline
usd_path: deeprobotics_lite3.usd
base_body_name: TORSO
foot_body_names: FL_FOOT|FR_FOOT|HL_FOOT|HR_FOOT
undesired_contact_body_names: FL_SHANK|FR_SHANK|HL_SHANK|HR_SHANK
hip_joint_names: .*_HipX_joint
# 토크·속도 한계가 관절군마다 다르다(URDF 실측: HipX/HipY 24N·m·26.2rad/s, Knee 36N·m·17.3rad/s).
# Isaac Lab 액추에이터 cfg는 이 값들을 관절 정규식 dict로 받으므로 그대로 나눠 준다.
# stiffness/damping은 제조사 리포 rl_training의 실측값(30.0/1.0)을 쓴다.
actuator:
  model: implicit
  stiffness: 30.0
  damping: 1.0
  effort_limit:
    .*_HipX_joint: 24.0
    .*_HipY_joint: 24.0
    .*_Knee_joint: 36.0
  velocity_limit:
    .*_HipX_joint: 26.2
    .*_HipY_joint: 26.2
    .*_Knee_joint: 17.3
# 스폰 시 베이스 높이(m) - 이 로봇은 Isaac Lab 공식 자산이 없어 참조할 init pos가 없다. 제조사
# 사양의 기립 높이 406mm를 쓰되, Isaac Lab이 go2(사양 ~400mm -> 0.40)·a1(-> 0.42)에 적용하는 규약과
# 맞춘 값이다. 비워두면 usd bbox 추정값(0.453)이 잡혀 리셋마다 그만큼 더 낙하한다.
spawn_height: 0.40
# 제조사 리포가 HipX만 작은 액션 스케일을 쓴다 - 좌우 벌림 관절이 과하게 움직이면 자세가 무너진다.
action_scale:
  .*_HipX_joint: 0.125
  ^(?!.*_HipX_joint).*$: 0.25
# Knee 가동범위가 [0.52, 2.79]로 0을 포함하지 않아 반드시 값을 줘야 한다(0이면 스폰 시 리밋 이탈).
# HipX·HipY는 0이 가동범위 안이라 나머지 관절 와일드카드가 0.0으로 채운다.
default_joint_pos_complete: false
default_joint_pos:
  FL_Knee_joint: 1.658
  FR_Knee_joint: 1.658
  HL_Knee_joint: 1.658
  HR_Knee_joint: 1.658
# 제조사 리포는 이벤트 구성이 달라 대조할 "부모 기본값 오버라이드"가 없다 - 경량 4족인 go2/a1과
# 같은 Isaac Lab 공식 오버라이드(push 끄기, 관절 초기자세 고정, 리셋 속도 0, 질량 -1~+3kg)를 쓴다.
domain_randomization:
  reset_joint_position_range: [1.0, 1.0]
  push_robot: false
  reset_base_velocity_range:
    x: [0.0, 0.0]
    y: [0.0, 0.0]
    z: [0.0, 0.0]
    roll: [0.0, 0.0]
    pitch: [0.0, 0.0]
    yaw: [0.0, 0.0]
  add_base_mass:
    range: [-1.0, 3.0]
    operation: add
# light_quadruped: 11.94kg으로 이 워크스페이스에서 가장 가벼운 4족이다 - go2(16.1kg)·a1보다도
# 가벼워 undesired_contacts를 켜면 정상 보행 중 스침까지 벌점을 먹는다(scripts/.../rl/rewards.py의
# LightQuadrupedRewards). 가중치는 같은 경량 4족인 go2/a1과 동일한 값을 쓴다 - 토크 스케일도
# 비슷하다(lite3 24~36N·m, go2 23.5N·m, a1 33.5N·m).
reward_type: light_quadruped
reward_weights:
  track_lin_vel_xy_exp: 1.5
  track_ang_vel_z_exp: 0.75
  lin_vel_z_l2: -2.0
  ang_vel_xy_l2: -0.05
  dof_torques_l2: -0.0002
  dof_acc_l2: -2.5e-7
  action_rate_l2: -0.01
  feet_air_time: 0.01
  feet_stumble: -1.0
  hip_pos: -0.5
