usd_path: deeprobotics_x30.usd
base_body_name: TORSO
foot_body_names: FL_FOOT|FR_FOOT|HL_FOOT|HR_FOOT
undesired_contact_body_names: FL_SHANK|FR_SHANK|HL_SHANK|HR_SHANK
actuator:
  type: simple
  stiffness: 84.0
  damping: 1.68
action:
  type: position_only
  scale: 0.5
rewards:
- name: track_lin_vel_xy_exp
  weight: 1.0
- name: track_ang_vel_z_exp
  weight: 0.5
- name: lin_vel_z_l2
  weight: -2.0
- name: ang_vel_xy_l2
  weight: -0.05
- name: dof_torques_l2
  weight: -1.0e-05
- name: dof_acc_l2
  weight: -2.5e-07
- name: action_rate_l2
  weight: -0.01
- name: flat_orientation_l2
  weight: -1.0
- name: dof_pos_limits
  weight: -1.0
- name: feet_air_time_multi
  weight: 0.125
  params:
    threshold: 0.5
- name: undesired_contacts
  weight: -1.0
  params:
    threshold: 1.0
default_joint_pos:
  FL_Knee_joint: 1.44
  FR_Knee_joint: 1.44
  HL_Knee_joint: 1.44
  HR_Knee_joint: 1.44
termination:
- contact
policy_architecture: mlp
algorithm: ppo
domain_randomization: basic
agent:
  num_envs: 4096
  max_iterations: 1500
  learning_rate: 0.001
  entropy_coef: 0.01
  hidden_dims:
  - 512
  - 256
  - 128
